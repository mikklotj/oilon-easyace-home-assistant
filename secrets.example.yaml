# Example secrets for packages/oilon_easyace.yaml
#
# Copy the entries you need into your Home Assistant secrets.yaml and replace
# the placeholders:
#   <HOST>      IP address or hostname of the heat pump controller, e.g. 192.0.2.10
#   <PIN>       the controller web UI PIN (the one you use in its web page)
#   <PASSWORD>  the password of the JSON API user (see README)
#
# Never commit your real secrets.yaml.

# Modbus TCP host (IP address or hostname, no http://)
oilon_host: "<HOST>"

# HTTP basic auth for the controller's JSON API (jsongen.html).
# On the reference unit the user name is "JSON".
oilon_json_username: "JSON"
oilon_json_password: "<PASSWORD>"

# Read URL polled every 30 s: outdoor temperature, heating circuit 2 flow.
# Note: "=" at the end of each OA code is URL-encoded as %3D.
oilon_json_read_url_fast: "http://<HOST>/jsongen.html?FN=Read&OA=AyKQeXo7AAE%3D&OA=AyJzpXo7AAE%3D&PIN=<PIN>&LNG=-1&US=1"

# Read URL polled every 60 s: average outdoor temp, compressor delay,
# average COP, electric heater energy, evaporating/condensing pressure,
# circuit 2 heat curve (max, min, points 1-6). Keep on one line.
oilon_json_read_url_slow: "http://<HOST>/jsongen.html?FN=Read&OA=ACPOV3o7AAE%3D&OA=ACOUmNm6AAE%3D&OA=ACIdJ096AAE%3D&OA=ACMpF096AAE%3D&OA=AyJSdHo7AAE%3D&OA=AyJbCXo7AAE%3D&OA=ACMk5cPwAAE%3D&OA=ACN6HsPwAAE%3D&OA=ACN1L8PwAAE%3D&OA=ACMWH8PwAAE%3D&OA=ACM3D8PwAAE%3D&OA=ACPQf8PwAAE%3D&OA=ACPxb8PwAAE%3D&OA=ACOSX8PwAAE%3D&PIN=<PIN>&LNG=-1&US=1"

# Write URL template used by rest_command.oilon_easyace_write_value.
# Keep the {{ oa | urlencode }} and {{ value }} placeholders as they are;
# Home Assistant fills them in when the action is called. %3B is ";".
oilon_json_write_url: "http://<HOST>/jsongen.html?FN=Write&OA={{ oa | urlencode }}%3B{{ value }}&PIN=<PIN>&LNG=-1&US=1"
